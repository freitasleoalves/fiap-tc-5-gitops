# ATENÇÃO: preencha com os valores reais (outputs `servicebus_connection_string`
# e `cosmosdb_connection_string` do Terraform) antes de sincronizar.
# Repositório PÚBLICO — se o GitHub bloquear o push (Push Protection),
# aplique via `kubectl create secret ... | kubectl apply -f -`.
apiVersion: v1
kind: Secret
metadata:
  name: azure-secrets
  namespace: notification
type: Opaque
stringData:
  servicebus-connection-string: "REPLACE_WITH_SERVICEBUS_CONNECTION_STRING"
  cosmosdb-connection-string: "REPLACE_WITH_COSMOSDB_CONNECTION_STRING"
