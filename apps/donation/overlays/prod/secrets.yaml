# ATENÇÃO: preencha com os valores reais (outputs
# `postgres_donation_connection_string` e `servicebus_connection_string`
# do Terraform) antes de sincronizar. Repositório PÚBLICO — se o GitHub
# bloquear o push (Push Protection), aplique via
# `kubectl create secret ... | kubectl apply -f -`.
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: donation
type: Opaque
stringData:
  donation-database-url: "REPLACE_WITH_POSTGRES_DONATION_CONNECTION_STRING"
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-secrets
  namespace: donation
type: Opaque
stringData:
  servicebus-connection-string: "REPLACE_WITH_SERVICEBUS_CONNECTION_STRING"
