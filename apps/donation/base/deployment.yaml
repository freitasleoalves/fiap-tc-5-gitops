apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  labels:
    app: donation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      containers:
        - name: donation-service
          image: acrsolidarytechprod.azurecr.io/donation-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: donation-database-url
            # Fase C adapta o código original (só AWS SQS) pra também
            # suportar Azure Service Bus via este toggle — mesmo padrão do
            # evaluation-service da Fase 3/4.
            - name: CLOUD_PROVIDER
              value: "azure"
            - name: AZURE_SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-secrets
                  key: servicebus-connection-string
            - name: AZURE_SERVICEBUS_QUEUE_NAME
              value: "donation-events"
            - name: OTEL_SERVICE_NAME
              value: "donation-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production"
          # Hot Path: mais headroom que os demais serviços + HPA (ver
          # overlays/prod/hpa.yaml) — é o serviço com SLO formal definido.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
