# ATENÇÃO: preencha com a connection string real (output
# `postgres_ngo_connection_string` do Terraform) antes de sincronizar.
# Repositório PÚBLICO — se o GitHub bloquear o push (Push Protection),
# aplique via `kubectl create secret ... | kubectl apply -f -`.
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: ngo
type: Opaque
stringData:
  ngo-database-url: "REPLACE_WITH_POSTGRES_NGO_CONNECTION_STRING"
