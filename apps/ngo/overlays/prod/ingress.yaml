apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngo-ingress
  # SEM rewrite-target: o ngo-service registra as rotas Flask COM o
  # prefixo (`/ngos`, `/ngos/<id>` — ver app.py, código original do
  # desafio, mantido como está por decisão do usuário). Um rewrite que
  # remove o prefixo (`/ngos` -> `/`) faz o Flask devolver 404 — bug real
  # encontrado na validação end-to-end. Path Prefix simples preserva o
  # path completo até o backend.
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ngos
            pathType: Prefix
            backend:
              service:
                name: ngo-service
                port:
                  number: 8081
