# ATENÇÃO: preencha com o valor real (output `cosmosdb_connection_string`
# do Terraform) antes de sincronizar. Repositório PÚBLICO — se o GitHub
# bloquear o push (Push Protection), aplique via
# `kubectl create secret ... | kubectl apply -f -`.
apiVersion: v1
kind: Secret
metadata:
  name: azure-secrets
  namespace: volunteer
type: Opaque
stringData:
  cosmosdb-connection-string: "REPLACE_WITH_COSMOSDB_CONNECTION_STRING"
