apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-velero
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.1.0
      helm:
        releaseName: velero
        valueFiles:
          - $values/addons/velero/values.yaml

    - repoURL: https://github.com/freitasleoalves/fiap-tc-5-gitops.git
      targetRevision: HEAD
      ref: values

    - repoURL: https://github.com/freitasleoalves/fiap-tc-5-gitops.git
      targetRevision: HEAD
      path: addons/velero
      directory:
        # include aceita uma lista separada por vírgula de glob patterns.
        include: "secrets.yaml,schedule.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
  # Mesmo racional do addon otel-collector-gateway: secrets.yaml versionado
  # só tem placeholders (repo público); o valor real (credenciais do SP do
  # Velero) é aplicado direto no cluster via `kubectl apply`, fora do Git.
  ignoreDifferences:
    - kind: Secret
      name: cloud-credentials
      jsonPointers:
        - /data
        - /stringData
