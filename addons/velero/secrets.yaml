# ATENÇÃO: substitua os placeholders pelos valores reais dos outputs do
# Terraform (fiap-tc-5-terraform):
#   velero_service_principal_client_id
#   velero_service_principal_client_secret
#   velero_tenant_id
# Formato exigido pelo velero-plugin-for-microsoft-azure (chave "cloud",
# conteúdo no formato de variáveis de ambiente).
#
# Este repositório é PÚBLICO — se o GitHub bloquear o push por causa dessas
# credenciais (Push Protection), aplique o valor real direto no cluster via
# `kubectl create secret ... | kubectl apply -f -` em vez de commitar o
# valor real aqui (mesma situação já enfrentada na Fase 4 com a API Key do
# Datadog).
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: velero
type: Opaque
stringData:
  cloud: |
    AZURE_SUBSCRIPTION_ID=REPLACE_WITH_SUBSCRIPTION_ID
    AZURE_TENANT_ID=REPLACE_WITH_VELERO_TENANT_ID
    AZURE_CLIENT_ID=REPLACE_WITH_VELERO_SP_CLIENT_ID
    AZURE_CLIENT_SECRET=REPLACE_WITH_VELERO_SP_CLIENT_SECRET
    AZURE_RESOURCE_GROUP=REPLACE_WITH_RESOURCE_GROUP_NAME
    AZURE_CLOUD_NAME=AzurePublicCloud
