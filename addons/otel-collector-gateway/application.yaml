apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-otel-collector-gateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.173.0
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/addons/otel-collector-gateway/values.yaml

    - repoURL: https://github.com/freitasleoalves/fiap-tc-5-gitops.git
      targetRevision: HEAD
      ref: values

    - repoURL: https://github.com/freitasleoalves/fiap-tc-5-gitops.git
      targetRevision: HEAD
      path: addons/otel-collector-gateway
      directory:
        include: "secrets.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
  # O secrets.yaml versionado só tem um placeholder (repo público — nunca
  # commitamos a API Key real). O valor real é aplicado direto no cluster
  # via `kubectl apply` (fora do Git); isso evita que o selfHeal do ArgoCD
  # reverta pro placeholder a cada ciclo de sync.
  ignoreDifferences:
    - kind: Secret
      name: datadog-api-key
      jsonPointers:
        - /data
        - /stringData
